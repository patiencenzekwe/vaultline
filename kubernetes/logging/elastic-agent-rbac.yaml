apiVersion: v1
kind: ServiceAccount
metadata:
  name: vaultline-agent
  namespace: logging
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vaultline-agent
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - namespaces
      - pods
      - services
      - endpoints
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources:
      - replicasets
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vaultline-agent
subjects:
  - kind: ServiceAccount
    name: vaultline-agent
    namespace: logging
roleRef:
  kind: ClusterRole
  name: vaultline-agent
  apiGroup: rbac.authorization.k8s.io