apiVersion: agent.k8s.elastic.co/v1alpha1
kind: Agent
metadata:
  name: vaultline-agent
  namespace: logging
spec:
  version: 8.18.0
  elasticsearchRefs:
    - name: vaultline
  policyID: eck-agent
  daemonSet:
    podTemplate:
      spec:
        tolerations:
          - key: node-role.kubernetes.io/master
            operator: Exists
            effect: NoSchedule
        serviceAccountName: vaultline-agent
        automountServiceAccountToken: true
        securityContext:
          runAsUser: 0
        containers:
          - name: agent
            resources:
              requests:
                memory: 200Mi
                cpu: 100m
              limits:
                memory: 500Mi
                cpu: 500m
            volumeMounts:
              - name: varlog
                mountPath: /var/log
              - name: varlibdockercontainers
                mountPath: /var/lib/docker/containers
            env:
              - name: NODE_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: spec.nodeName
        volumes:
          - name: varlog
            hostPath:
              path: /var/log
          - name: varlibdockercontainers
            hostPath:
              path: /var/lib/docker/containers
  config:
    outputs:
      default:
        type: elasticsearch
        hosts:
          - "https://vaultline-es-http.logging.svc.cluster.local:9200"
        ssl:
          verification_mode: none
        username: elastic
        password: "${ES_PASSWORD}"
    inputs:
      - name: kubernetes-container-logs
        type: filestream
        use_output: default
        streams:
          - id: kubernetes-container-logs
            paths:
              - /var/log/containers/*.log
            parsers:
              - container: {}
            prospector.scanner.symlinks: true
            index: "vaultline-logs-%{[agent.id]}"