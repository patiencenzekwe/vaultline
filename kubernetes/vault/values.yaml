global:
  enabled: true

server:
  replicas: 1
  affinity: ""
  
  ha:
    enabled: false

  dataStorage:
    enabled: true
    size: 10Gi
    storageClass: gp2

  auditStorage:
    enabled: true
    size: 10Gi
    storageClass: gp2

  standalone:
    enabled: true
    config: |
      ui = true

      listener "tcp" {
        tls_disable = 1
        address = "[::]:8200"
        cluster_address = "[::]:8201"
      }

      storage "file" {
        path = "/vault/data"
      }

ui:
  enabled: true
  serviceType: ClusterIP